<script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  
  fbq('init', '1862309938079396');
  fbq('track', 'PageView');

  function trackCheckout(){
    fbq('track', 'InitiateCheckout', {
      content_name: "L'Art du Plaisir Masculin",
      content_ids: ['01'],
      value: 16.01,
      currency: 'EUR'
    });
  }

  /* ---------- LIVE COUNTER ---------- */
  (function(){
    let base = 1847;
    const els = [
      document.getElementById('header-counter'),
      document.getElementById('cta-counter-1'),
      document.getElementById('cta-counter-2')
    ].filter(Boolean);

    function format(n){
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    }

    function update(){
      if(Math.random() > 0.7){
        base += 1;
        els.forEach(el => el.textContent = format(base));
      }
    }
    setInterval(update, 20000);
  })();
</script>
